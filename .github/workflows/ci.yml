# PR/push CI: the same gates bin/release.sh and pre-commit enforce locally, run
# on every change so a bad commit (or an unvetted Dependabot bump) is caught
# before merge instead of at release time. The Docker image build lives in its
# own path-filtered workflow (docker-build.yml) so it only runs when docker/**
# changes — Go correctness is already covered by the `test` job here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Unit tests (race)
        run: make unit
      - name: Smoke test (end-to-end shims)
        run: bin/smoke-test.sh

  # Run the pre-commit gate itself rather than re-implementing each hook — this
  # uses the exact hook versions pinned in .pre-commit-config.yaml (shellcheck,
  # gitleaks, whitespace/yaml) so CI can never drift from the local gate, and it
  # auto-follows any hook the maintainer adds. gofmt + golangci-lint are `local`
  # hooks that shell out to the toolchain, so Go and golangci-lint must be on
  # PATH first.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install golangci-lint (the local pre-commit hook shells out to it)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: pre-commit/action@v3.0.1
