# Build and publish the containerized worker image to GHCR.
#
# Built natively for linux/arm64 (the prod target's architecture) on GitHub's
# free arm64 runners for public repos — no QEMU emulation. Triggers on version
# tags (matching bin/release.sh) and on manual dispatch.
#
# Pull on the target host:
#   docker pull ghcr.io/<owner>/agent-chat-worker:<version>   (or :latest)
name: Publish worker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-chat-worker

jobs:
  publish:
    runs-on: ubuntu-24.04-arm   # native arm64 → no emulation
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Default flavor latest=auto tags :latest automatically on a semver
          # tag push (a tag is not a branch, so an is_default_branch guard would
          # never fire here). Manual dispatch yields just the :sha tag.
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
